# Local server for sync tests and the Mac demo: Postgres plus the api, synthetic data only.
#   docker compose up --build
# The api listens on http://localhost:8080. A local key stands in for Cloud KMS.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: iep
      POSTGRES_PASSWORD: local-only-not-a-secret
      POSTGRES_DB: iep
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iep -d iep"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dbdata:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["pnpm", "--filter", "@iep/db", "migrate"]
    environment:
      DATABASE_URL: postgres://iep:local-only-not-a-secret@db:5432/iep
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      IEP_DATA_CLASS: synthetic
      HOST: 0.0.0.0
      PORT: "8080"
      # Local stand-in for Cloud KMS: a random key is generated on first start and kept in the
      # keys volume, so nothing secret is committed.
      IEP_FIELD_KEY_FILE: /keys/field.key
      DATABASE_URL: postgres://iep:local-only-not-a-secret@db:5432/iep
    volumes:
      - keys:/keys
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  dbdata:
  keys:
