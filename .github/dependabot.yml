version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # One PR for all action bumps, not one per action: each PR costs a full run on the Mac mini.
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: swift
    directory: /apps/apple/Packages/CoreModels
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
