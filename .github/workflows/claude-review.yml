# Claude reviews every same-repo pull request using the repository secret ANTHROPIC_API_KEY.
# Mention @claude in a PR comment for a follow-up. Runs on GitHub-hosted runners only.
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write # required by claude-code-action to obtain its GitHub token

jobs:
  review:
    # Same-repo PRs only: fork PRs get no secrets and must not spend API credit.
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for ordinary code problems: bugs, regressions and unclear code.
            Read the README first for project rules. No style nits, no speculation.
            For each problem, leave an inline comment on the exact line with: severity
            (high, medium, low), what is wrong and the fix.
            Comment only on correctness, tests, readability and style. Never describe security
            weaknesses, missing protections, unfinished or planned security work, or how the
            system could be attacked, in any comment, summary or check output. If you suspect a
            security problem, write only: "Needs private review: <file>" and nothing else about it.
            Then post one summary comment with `gh pr comment`: findings ranked by severity,
            and the first line exactly "Claude review: BLOCK" if any high finding exists,
            otherwise "Claude review: PASS". Never print secret values.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"

  mention:
    # "@claude ..." in a PR comment from the owner or a collaborator.
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-mention-${{ github.event.comment.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
