# Claude reviews every same-repo pull request using the repository secret ANTHROPIC_API_KEY, through a
# direct Messages API call (tools/ci/claude-review.mjs). The key is used in the review job only.
# This file is replaced by claude-review-trusted.yml (workflow_run) and is removed in a follow-up.
# Runs on GitHub-hosted runners only.
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
    # Same-repo PRs only: fork PRs get no secrets and must not spend API credit.
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The pull request's checkout is read for README.md only. The script itself comes from the
      # default branch, so a branch cannot change what runs with the API key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      # The job fails when the verdict is BLOCK or the review could not run: the "Approval on head"
      # check reads this run's conclusion, not the comment text.
      - name: Review the diff and post the verdict comment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node trusted/tools/ci/claude-review.mjs
