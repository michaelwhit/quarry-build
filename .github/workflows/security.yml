name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# The Mac mini runs one job at a time and is short on memory: stop superseded runs.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          # Pinned release plus the sha256 from its published checksums file; sha256sum -c fails the job on any mismatch.
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          # Scan the history this PR would merge (HEAD), not every remote branch: actions/checkout
          # with fetch-depth 0 fetches all of them, and another track's branch is scanned in its own PR.
          ./gitleaks detect --source . --redact --no-banner --log-opts="HEAD"

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setuptools<81 keeps pkg_resources, which semgrep 1.100.0 imports through opentelemetry.
      # Replaces CodeQL, which needs paid Code Security on a private repo (decision 2026-10-17).
      # Public registry rulesets only; no login, no token, metrics off, code is not uploaded.
      - name: Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --quiet semgrep==1.100.0 "setuptools<81"
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --metrics=off --error \
            --config p/typescript --config p/nodejs --config p/security-audit --config p/react \
            services packages tools apps/web/src apps/web/scripts apps/web/public

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high --prod
