<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Preview drawing of a goal bank with one sample goal opened to show the whole goal wording and its measures">
  <rect width="900" height="560" fill="#000000"/>
  <rect x="0" y="0" width="900" height="28" fill="#ffb454"/>
  <text x="450" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0e1420" letter-spacing="1">TEST DATA · preview drawing, not a built screen</text>
  <text x="40" y="84" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#e8edf7">Goal bank</text>
  <text x="40" y="112" font-family="system-ui, sans-serif" font-size="16" fill="#9fb0cc">Sample goal wording. Preview.</text>
  <g font-family="system-ui, sans-serif">
    <rect x="40" y="136" width="820" height="260" rx="14" fill="#1c1c1e" stroke="#7ee0c3" stroke-width="2"/>
    <text x="64" y="168" font-size="14" font-weight="700" fill="#7ee0c3">Reading · whole goal</text>
    <text x="64" y="202" font-size="18" fill="#e8edf7">Given a short passage at the student's level, the student will answer</text>
    <text x="64" y="228" font-size="18" fill="#e8edf7">who, what and where questions with 80% accuracy in 4 of 5 sessions.</text>
    <text x="64" y="270" font-size="15" fill="#9fb0cc">Measured by</text><text x="200" y="270" font-size="15" fill="#e8edf7">Percent correct, 2x weekly</text>
    <text x="64" y="296" font-size="15" fill="#9fb0cc">Target</text><text x="200" y="296" font-size="15" fill="#e8edf7">80% in 4 of 5 sessions</text>
    <text x="64" y="322" font-size="15" fill="#9fb0cc">Criteria</text><text x="200" y="322" font-size="15" fill="#e8edf7">4 of 5 consecutive sessions</text>
    <rect x="740" y="344" width="100" height="32" rx="8" fill="#5b8cff"/>
    <text x="790" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#0e1420">Add</text>
    <rect x="40" y="416" width="820" height="64" rx="14" fill="#1c1c1e" stroke="#2c2c2e"/>
    <text x="64" y="454" font-size="14" font-weight="700" fill="#7ee0c3">Behavior</text>
  </g>
</svg>
