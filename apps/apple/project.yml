# XcodeGen spec. The .xcodeproj is generated, never committed: `xcodegen generate` in this folder
# (CI does it before every build).
name: IEPAssistant
options:
  bundleIdPrefix: com.example.app
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Signing is set per developer; CI builds unsigned.
    CODE_SIGN_STYLE: Automatic
configs:
  Debug: debug
  Demo: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Demo: Config/Demo.xcconfig
  Release: Config/Release.xcconfig
packages:
  CoreModels: { path: Packages/CoreModels }
  Persistence: { path: Packages/Persistence }
  SyncEngine: { path: Packages/SyncEngine }
  APIClient: { path: Packages/APIClient }
  AuthKit: { path: Packages/AuthKit }
  Audit: { path: Packages/Audit }
  DesignSystem: { path: Packages/DesignSystem }
  FeatureStudents: { path: Packages/FeatureStudents }
  FeatureDataCollection: { path: Packages/FeatureDataCollection }
  FeatureSession: { path: Packages/FeatureSession }
  FeatureEvaluation: { path: Packages/FeatureEvaluation }
  FeatureAIAssist: { path: Packages/FeatureAIAssist }
  FeatureAdmin: { path: Packages/FeatureAdmin }
  PDFKitRendering: { path: Packages/PDFKitRendering }
targets:
  IEPAssistant-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: macOS
      - path: ../../packages/synthetic-data/fixtures/demo-district.json
        buildPhase: resources
        group: Resources
    entitlements:
      path: macOS/IEPAssistant.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.app.mac
        APP_DISPLAY_NAME: Demo App
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    dependencies: &appDependencies
      - package: CoreModels
      - package: Persistence
      - package: SyncEngine
      - package: APIClient
      - package: AuthKit
      - package: Audit
      - package: DesignSystem
      - package: FeatureStudents
      - package: FeatureDataCollection
      - package: FeatureSession
      - package: FeatureEvaluation
      - package: FeatureAIAssist
      - package: FeatureAdmin
      - package: PDFKitRendering
  IEPAssistant-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: iOS
      - path: ../../packages/synthetic-data/fixtures/demo-district.json
        buildPhase: resources
        group: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.app.ios
        APP_DISPLAY_NAME: Demo App
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    dependencies: *appDependencies
schemes:
  IEPAssistant-macOS:
    build:
      targets:
        IEPAssistant-macOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
  IEPAssistant-iOS:
    build:
      targets:
        IEPAssistant-iOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
